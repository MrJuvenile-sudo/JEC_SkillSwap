<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    
    <!-- Accent Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Gold Crest Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4f46e5" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#818cf8" stroke-width="1.5" filter="url(#glow)"/>

  <!-- Inner Tech Circuit / Shield Border -->
  <path d="M12 18 L32 10 L52 18 L52 36 C52 47 43 54 32 58 C21 54 12 47 12 36 Z" 
        fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Reciprocal Swap Dynamic Arrows (SkillSwap Logo Motif) -->
  <!-- Top Forward Arrow (Cyan) -->
  <path d="M22 26 C22 22 26 19 32 19 C37 19 41 21 42 24" 
        fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="42,20 46,25 40,26" fill="#38bdf8" />

  <!-- Bottom Return Arrow (Violet/Indigo) -->
  <path d="M42 38 C42 42 38 45 32 45 C27 45 23 43 22 40" 
        fill="none" stroke="#a5b4fc" stroke-width="3" stroke-linecap="round"/>
  <polygon points="22,44 18,39 24,38" fill="#a5b4fc" />

  <!-- Central Master Shield / Keyhole Emblem (Admin Symbol) -->
  <circle cx="32" cy="32" r="7" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5" />
  <path d="M32 29 C30.9 29 30 29.9 30 31 C30 31.8 30.5 32.4 31.2 32.7 L31 35 L33 35 L32.8 32.7 C33.5 32.4 34 31.8 34 31 C34 29.9 33.1 29 32 29 Z" fill="#1e1b4b" />

  <!-- Top-Right Live Operational Indicator (Emerald Pulse) -->
  <circle cx="50" cy="14" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="50" cy="14" r="2" fill="#ffffff" />
</svg>
